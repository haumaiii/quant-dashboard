name: Update 0050 closing prices

on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-0050
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download 0050 closing prices and prepare site
        run: |
          mkdir public
          cp index.html public/
          python3 update-0050.py
          mv 0050-closes.json public/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - uses: actions/deploy-pages@v4
        id: deploy
